# Compile les installeurs de Legi sur les machines de GitHub :
#   - macOS (Apple Silicon et Intel) : .dmg / .app
#   - Windows : .exe (NSIS) et .msi
#   - Linux : .deb, .rpm, .AppImage
#   - Android : .apk (signé avec la clé de debug, installable pour tester)
#
# Déclenchement : pousser un tag « v0.1.0 », ou bouton « Run workflow » dans
# l'onglet Actions. Avec un tag, les fichiers sont joints à une release GitHub
# en brouillon ; sinon ils sont téléchargeables dans les « artifacts » du run.
name: Installeurs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature macOS facultative : sans ces secrets, l'app est livrée non signée
          # (macOS demande alors une confirmation à la première ouverture).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Legi ${{ github.ref_name }}
          releaseBody: Installeurs de Legi. Voir le README pour l'installation sur chaque système.
          releaseDraft: true

      - name: Conserver les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: legi-${{ runner.os }}-${{ matrix.rust-targets || 'x64' }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: NDK Android
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Projet Android
        run: npx tauri android init --ci

      # APK signé avec la clé de debug : installable directement sur un téléphone
      # pour tester. Pour le Play Store, voir « Android » dans le README.
      - name: Compilation
        run: npx tauri android build --debug --apk

      - name: Renommer l'APK
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" -path "*debug*" | head -n 1)
          mkdir -p out && cp "$apk" "out/Legi-${GITHUB_REF_NAME//\//-}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: legi-android
          path: out/*.apk

      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Legi ${{ github.ref_name }}
          files: out/*.apk
